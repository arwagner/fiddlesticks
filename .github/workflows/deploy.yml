name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and never cancel one half-way through an rsync.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
      # The key is locked to the web root by rrsync, which takes paths relative to it.
      - run: DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key" npm run deploy
        env:
          DEPLOY_PATH: .
